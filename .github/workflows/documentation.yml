name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Superseded pull-request runs are cancelled; pushes to main and manual
# dispatches queue instead so an in-progress Pages deployment is never
# cancelled mid-run.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Pages artifact
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/documentation-build.yml

  deploy:
    name: Deploy GitHub Pages
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'
      }}
    needs: build
    runs-on: ubuntu-latest
    # Headroom for a patient deploy poll (15m) plus the independent
    # verification sweep below, which retries for a further 5m.
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # This action publishes the deployment and then polls the Pages status
      # API until it reports success. Those are separate failures: on
      # 2026-08-06 two consecutive runs published correctly and then aborted
      # at the poll's 600000ms default ("Timeout reached, aborting!"), turning
      # a live, correct deployment into a red badge.
      #
      # Be more patient with the poll, and -- because the verification step
      # below proves deployment from the live site far more strongly than the
      # status API does -- do not let a poll timeout alone fail the job. A
      # deployment that genuinely did not land still fails, in that step, with
      # a far more useful diagnostic.
      - name: Deploy Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 900000
          error_count: 20

      # page_url is empty when the poll aborted, so fall back to the Pages
      # API rather than losing the ability to verify.
      - name: Resolve Pages site URL
        id: site
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page_url="$PAGE_URL"
          if [[ -z "$page_url" ]]; then
            page_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')"
          fi
          if [[ -z "$page_url" ]]; then
            echo "error: could not determine the Pages site URL" >&2
            exit 1
          fi
          printf 'page_url=%s\n' "$page_url" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOYMENT_OUTCOME" != success ]]; then
            printf '::warning::Pages deploy step reported `%s`; verifying the live site directly.\n' \
              "$DEPLOYMENT_OUTCOME"
          fi

      - name: Verify deployed commit and catalog pages
        env:
          PAGE_URL: ${{ steps.site.outputs.page_url }}
        run: |
          set -euo pipefail
          site_url="${PAGE_URL%/}/"
          provenance="$RUNNER_TEMP/swiftql-pages-provenance.json"
          deployed=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${site_url}swiftql-pages-provenance.json?run=${GITHUB_RUN_ID}" \
              --output "$provenance" \
              && jq --exit-status \
                --arg commit_sha "$GITHUB_SHA" \
                --arg run_id "$GITHUB_RUN_ID" \
                '.commit_sha == $commit_sha and
                 .run_id == $run_id and
                 (.run_attempt | type == "string" and length > 0)' \
                "$provenance" > /dev/null; then
              deployed=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              sleep 10
            fi
          done
          if [[ "$deployed" != true ]]; then
            echo "error: deployed provenance did not match this commit and run" >&2
            exit 1
          fi
          landing="$RUNNER_TEMP/swiftql-landing.html"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$site_url" \
            --output "$landing"
          grep -qF \
            '<title>SwiftQL - SQL, as a first-class language in Swift</title>' \
            "$landing"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}swiftql-logo.png" \
            --output /dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}documentation/swiftql/" \
            --output /dev/null
          blog="$RUNNER_TEMP/swiftql-blog.html"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}blog/" \
            --output "$blog"
          grep -qF '<title>SwiftQL Blog</title>' "$blog"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}blog/posts/why-i-taught-the-swift-compiler-to-read-sql/" \
            --output /dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}blog/posts/whats-new-in-1-5-5/" \
            --output /dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}documentation/swiftql/gettingstarted/" \
            --output /dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}data/documentation/swiftql.json" \
            | jq --exit-status '.metadata.title == "SwiftQL"' > /dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${site_url}data/documentation/swiftql/gettingstarted.json" \
            | jq --exit-status \
              '(.metadata.title | ascii_downcase) == "getting started"' \
              > /dev/null

      - name: Record deployment summary
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGE_URL: ${{ steps.site.outputs.page_url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          {
            printf '### SwiftQL documentation deployment\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Artifact ID: `%s`\n' "$ARTIFACT_ID"
            printf -- '- Run: https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Site: %s\n' "$PAGE_URL"
            printf -- '- Deploy step outcome: `%s`\n' "$DEPLOYMENT_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
