# TEMPORARY. Diagnostic sweep for #530, deleted before that issue's branch
# merges. Kept out of swift.yml so the release-gate workflow is untouched
# while the cause is being narrowed.
name: Probe 530

on:
  push:
    branches: ['claude/530-todo-demo-swift6-crash']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Swift 6.0 (Xcode 16.2)
            developer_dir: /Applications/Xcode_16.2.app/Contents/Developer
          # The boundary claim COMPATIBILITY.md is about to make. Measured
          # rather than assumed.
          - label: Swift 6.1 (Xcode 16.4)
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Report the compiler
        run: xcrun swift --version

      - name: Sweep the probes
        run: scripts/ci/probe-530.sh "$RUNNER_TEMP/probe-530"

      - name: Upload probe logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && !cancelled() }}
        with:
          name: swiftql-probe-530-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-530
          if-no-files-found: warn
          retention-days: 7
