# TEMPORARY. Diagnostic for #530, deleted before that issue's branch merges.
name: Probe 530

on:
  push:
    branches: ['claude/530-todo-demo-swift6-crash']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Can ${{ matrix.label }} build the demo for iOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Xcode 16.4
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - label: Xcode 26.3
            runner: macos-15
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
          - label: Xcode 26.5
            runner: macos-26
            developer_dir: /Applications/Xcode_26.5.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: SDKs and runtimes
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          xcrun simctl list runtimes | grep -i ios || true

      - name: Build the app for a generic iOS simulator
        run: |
          set +e
          xcodebuild build \
            -project Examples/TodoApp/TodoApp.xcodeproj \
            -scheme TodoApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E '^(\*\*|.*(error|warning):)' | head -30
          echo "exit: ${PIPESTATUS[0]}"
